1. ERZURUM ROUTER

enable
configure terminal

! --- [Adım 1: Arayüz IP Yapılandırmaları] ---!
interface GigabitEthernet0/0
 ip address 10.0.1.1 255.255.255.0
 no shutdown
exit

interface Serial0/3/0
 ip address 10.10.10.2 255.255.255.252
 no shutdown
exit

! --- [Adım 2: Statik Yönlendirme (Static Route)] ---!
!--- Ankara HQ ve İstanbul ağlarına gitmek için Merkez Router bacağına yönlendirme---!
ip route 10.0.2.0 255.255.255.0 10.10.10.1
ip route 10.0.3.0 255.255.255.0 10.10.10.1


! --- [Adım 3: Siber Güvenlik (Extended ACL)] ---!
!--- Erzurum'dan İstanbul'a giden pingi engelle, Ankara HQ ve diğer her yere izin ver---!
ip access-list extended THY_Siber_Guvenlik
 deny icmp 10.0.1.0 0.0.0.255 10.0.3.0 0.0.0.255
 permit ip any any
exit

!-- Kuralı Erzurum yerel ağının giriş kapısına mühürleme---!
interface GigabitEthernet0/0
 ip access-group THY_Siber_Guvenlik in
exit

end
write memory




2. ANKARA HQ ROUTER


enable
configure terminal

! --- [Adım 1: Arayüz IP Yapılandırmaları] ---!
interface GigabitEthernet0/0
 ip address 10.0.2.1 255.255.255.0
 no shutdown
exit

interface Serial0/3/0
 ip address 10.10.10.1 255.255.255.252
 no shutdown
exit

interface Serial0/3/1
 ip address 20.20.20.1 255.255.255.252
 no shutdown
exit

! --- [Adım 2: Statik Yönlendirme (Static Route)] ---!
! ---Merkezden Erzurum ve İstanbul iç ağlarına yönlendirme kapıları---!
ip route 10.0.1.0 255.255.255.0 10.10.10.2
ip route 10.0.3.0 255.255.255.0 20.20.20.2

end
write memory




3. İSTANBUL ROUTER

enable
configure terminal

! --- [Adım 1: Arayüz IP Yapılandırmaları] ---!
interface GigabitEthernet0/0
 ip address 10.0.3.1 255.255.255.0
 no shutdown
exit

interface Serial0/3/1
 ip address 20.20.20.2 255.255.255.252
 no shutdown
exit

! --- [Adım 2: Statik Yönlendirme (Static Route)] ---!
!--- Ankara HQ sunucu bloğuna ve Erzurum şubesine gitmek için merkez bacağına yönlendirme---!
ip route 10.0.2.0 255.255.255.0 20.20.20.1
ip route 10.0.1.0 255.255.255.0 20.20.20.1

end
write memory

